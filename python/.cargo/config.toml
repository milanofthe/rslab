# Published wheels must run on any CPU of their platform, not just the CI
# runner's: pin each wheel target to rustc's own default CPU. The repo root's
# `build.rustflags = target-cpu=native` cannot be cleared from here (cargo
# joins config arrays across files, so an empty list is a no-op), but any
# `target.<cfg>.rustflags` replaces `build.rustflags` outright. maturin runs
# with working-directory: python, so wheel builds pick this file up.
[target.'cfg(all(target_arch = "x86_64", not(target_vendor = "apple")))']
rustflags = ["-C", "target-cpu=x86-64"]

[target.'cfg(all(target_arch = "x86_64", target_vendor = "apple"))']
rustflags = ["-C", "target-cpu=penryn"]

[target.'cfg(all(target_arch = "aarch64", not(target_vendor = "apple")))']
rustflags = ["-C", "target-cpu=generic"]

[target.'cfg(all(target_arch = "aarch64", target_vendor = "apple"))']
rustflags = ["-C", "target-cpu=apple-m1"]
