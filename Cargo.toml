[workspace]
members = [".", "xtask", "crates/rslab-ordering-core", "crates/rslab-amd", "crates/rslab-amf", "crates/rslab-metis"]
# The PyO3 bindings live in `python/` and are built by maturin, not cargo. They
# depend on `rslab` via path and carry a `cdylib` linking libpython, so they are
# explicitly excluded from the pure-Rust workspace (FFI lives only in tooling /
# bindings, never the solver core). Build them with `maturin` from `python/`.
exclude = ["python"]
resolver = "2"

[package]
name = "rslab"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "RSLAB - pure-Rust sparse complex/real direct solver (symmetric LDL^T + unsymmetric LU) and preconditioner, a PARDISO-style embeddable replacement."
authors = ["Milan Rother"]
repository = "https://github.com/milanofthe/rslab"
homepage = "https://github.com/milanofthe/rslab"
readme = "README.md"
keywords = ["sparse", "solver", "linear-algebra", "ldlt", "kkt"]
categories = ["mathematics", "science"]
autobins = true
autoexamples = false
autotests = true
exclude = [
    "/benches",
    "/examples",
    "/src/bin",
    "/tests",
    "/.github",
    "/.githooks",
    "/docs",
    "/python",
    "/tools",
    "/xtask",
]

[lib]
name = "rslab"

[features]
# Parametrized test-matrix generators (pure Rust, no extra deps). Off by default
# so downstream solver users don't pull it in; enable for tests/benches.
matgen = []
# Adds a SuiteSparse / Matrix Market downloader (pure-Rust HTTP/TLS + gzip + tar).
matgen-download = ["matgen", "dep:ureq", "dep:flate2", "dep:tar"]
# Hardware-aware auto-tuning + resource governor (HardwareInfo via sysinfo,
# calibration cache, budget planner). Pure-Rust dep.
tuning = ["dep:sysinfo"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Complex scalars (`Complex<f64>`, `Complex<f32>`) of the `Scalar` trait.
num-complex = "0.4"
# Work stealing for the assembly-tree drivers, the orderings and the solves.
rayon = "1.10"
# Real and complex SIMD GEMM of the dense kernels (runtime AVX2/AVX-512
# dispatch; the AVX-512 kernels exist only with `x86-v4`).
gemm = { version = "0.19", features = ["x86-v4"] }
# The fill-reducing orderings behind `OrderingMethod`.
rslab-ordering-core = { path = "crates/rslab-ordering-core", version = "1.0" }
rslab-amd = { path = "crates/rslab-amd", version = "1.0" }
rslab-amf = { path = "crates/rslab-amf", version = "1.0" }
rslab-metis = { path = "crates/rslab-metis", version = "1.0" }
# Optional, only for the `matgen-download` feature (SuiteSparse/Matrix Market
# fetcher). Pure Rust: ureq+rustls (no OpenSSL), flate2/miniz_oxide, tar.
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
# Hardware probe (cores + RAM) for the `tuning` feature. Pure Rust.
sysinfo = { version = "0.31", optional = true, default-features = false, features = ["system"] }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
# Reference solver of the benchmark suite: faer has no complex-symmetric
# LDL^T, so its sparse LU on the full matrix is the comparison.
faer = "0.22"
# Loads MKL PARDISO at run time for the benchmark suite (bench-only FFI).
libloading = "0.8"

[[bench]]
name = "klu_circuit"
harness = false

[[bench]]
name = "klu_realworld"
harness = false
required-features = ["matgen-download"]

# The cancellation test builds its matrices with the generators.
[[test]]
name = "interrupt"
required-features = ["matgen"]

[[bench]]
name = "bench_suite"
harness = false
required-features = ["matgen"]

[profile.release]
debug = true

[[example]]
name = "mtx_bench"

[[example]]
name = "metis_timing"

[[example]]
name = "solve_timing"

[[example]]
name = "ordering_bakeoff"
