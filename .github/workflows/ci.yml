name: ci

# https://github.com/milanofthe/rslab/issues/292
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # https://github.com/milanofthe/rslab/issues/292
  RUSTFLAGS: -C target-cpu=x86-64-v3

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: milanofthe/negentropy@v1.7.1
      - name: toolchain as pinned in rust-toolchain.toml
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cache, seeded by failed runs too
        uses: Swatinem/rust-cache@v2
        with:
          # https://github.com/milanofthe/rslab/issues/292
          cache-on-failure: true
          workspaces: |
            . -> target
            python -> target

      - name: rustfmt
        run: cargo fmt --check

      # https://github.com/milanofthe/rslab/issues/292
      - name: python lock matches the manifests
        run: cargo metadata --locked --format-version 1 --manifest-path python/Cargo.toml > /dev/null

      - name: python extension compiles (a crate outside the workspace)
        run: cargo check --locked --manifest-path python/Cargo.toml

      - name: clippy (all targets, matgen and tuning)
        run: cargo clippy --all-targets --features matgen,tuning -- -D warnings

      - name: rustdoc (broken links are errors)
        run: cargo doc --no-deps --features matgen,tuning
        env:
          RUSTDOCFLAGS: -D warnings

      # https://github.com/milanofthe/rslab/issues/292
      - name: test (matgen superset)
        run: cargo test --features matgen,rsprobe/alloc
